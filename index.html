<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunset Lanes — Resort Bowling</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230e7d86'/%3E%3Ccircle cx='13' cy='13' r='2' fill='%23083439'/%3E%3Ccircle cx='20' cy='13' r='2' fill='%23083439'/%3E%3Ccircle cx='16.5' cy='19' r='2' fill='%23083439'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="debug"></div>

    <header id="topbar">
      <div id="brand">SUNSET<span>LANES</span></div>
      <div id="scorecard-wrap">
        <table id="scorecard" aria-label="Scorecard"></table>
      </div>
      <div id="top-buttons">
        <button id="mute-btn" aria-label="Toggle sound" title="Mute (M)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <button id="restart-btn" title="Restart (R)">Restart</button>
      </div>
    </header>

    <div id="message"></div>

    <div id="bottom-hud">
      <aside id="controls-panel">
        <h3>Controls</h3>
        <ul>
          <li><kbd>A</kbd><kbd>D</kbd> move ball</li>
          <li><kbd>Q</kbd><kbd>E</kbd> aim</li>
          <li><kbd>SPACE</kbd> hold to charge, release to throw</li>
          <li><kbd>W</kbd><kbd>S</kbd> spin while charging</li>
          <li><kbd>M</kbd> mute · <kbd>R</kbd> restart</li>
        </ul>
      </aside>
      <div id="meter-wrap">
        <div id="frame-indicator">Frame 1 · Ball 1</div>
        <div id="meters-row">
          <div id="power-meter" title="Power"><div id="power-fill"></div></div>
          <div id="spin-dial" title="Spin">
            <div id="spin-track"></div>
            <div id="spin-needle"></div>
            <span class="spin-label left">HOOK L</span>
            <span class="spin-label right">HOOK R</span>
          </div>
        </div>
        <div id="hint">Hold <kbd>SPACE</kbd> to charge — release to bowl</div>
      </div>
    </div>
  </div>

  <!-- Title screen / game over -->
  <div id="overlay" class="show">
    <div id="overlay-card">
      <h1 id="overlay-title">SUNSET LANES</h1>
      <p id="overlay-sub">Resort Bowling — 10 frames, real rules, real physics</p>
      <button id="overlay-btn">PLAY</button>
    </div>
    <div id="final-panel">
      <div id="final-score">0</div>
      <div id="final-rank">SOLID GAME</div>
      <button id="play-again">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
